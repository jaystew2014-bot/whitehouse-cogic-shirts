<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shirt Printer · Whitehouse COGIC</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3F1D10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caprasimo&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF2E9; --paper:#FFFBF6; --ink:#3A1C10; --soft:#6F5244; --line:#E6D5C3;
  --choc:#3F1D10; --maroon:#6E1626; --maroon-d:#571020; --sage-wash:#EDF2E2; --green:#CFE0B4; --green-d:#3E5A1F;
  --display:'Caprasimo',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

.top{background:var(--choc);color:var(--bg);padding:20px 0 18px}
.top h1{font:400 clamp(26px,6.6vw,42px)/1.08 var(--display);margin:0}
.top p{margin:6px 0 0;font-size:16px;opacity:.92}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:400 30px/1.05 var(--display)}
.stat span{color:var(--soft);font-size:14px;line-height:1.2;display:block}
.stat.todo{background:var(--maroon);border-color:var(--maroon);color:#fff}
.stat.todo span{color:#fff;opacity:.85}

.bar{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#EFE2D3;border-radius:12px;padding:4px}
.tab{border:0;border-radius:9px;background:none;padding:10px 4px;font-weight:700;font-size:15px;line-height:1.2}
.tab[aria-selected=true]{background:var(--choc);color:var(--bg)}
.tab small{display:block;font-weight:400;font-size:13px;opacity:.8}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--soft)}
.tools label{display:flex;align-items:center;gap:8px;cursor:pointer}
.tools input{width:20px;height:20px;accent-color:var(--maroon)}
.refresh{border:0;background:none;padding:6px 0;color:var(--maroon);font-weight:700;text-decoration:underline;font-size:15px}

.list{display:grid;gap:14px;padding:16px 0 40px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 16px}
.card.new{border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon)}
.card.done{background:#F6F8F1;border-color:#D5E2C3}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.num{font:400 28px/1 var(--display);color:var(--maroon)}
.card.done .num{color:var(--green-d)}
.who{margin-top:4px;font-weight:700}
.when{color:var(--soft);font-size:14px}
.tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap}
.tag.paid{background:var(--green);color:var(--green-d)}
.tag.unpaid{background:#F6E1E4;color:var(--maroon)}
.tag.newt{background:var(--maroon);color:#fff}
.items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.items li{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}
.items img{width:54px;height:54px;border-radius:10px;background:var(--bg);display:block}
.items b{display:block;line-height:1.25}
.items .sub{color:var(--soft);font-size:15px}
.qty{font:400 22px/1 var(--display);min-width:44px;text-align:right}
.size{display:inline-block;min-width:38px;text-align:center;padding:1px 6px;border-radius:7px;background:var(--choc);color:var(--bg);font-weight:700;font-size:14px;margin-left:4px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#FFF4D6;font-size:15px}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.complete{flex:1;min-height:54px;border:0;border-radius:12px;background:var(--maroon);color:#fff;font-weight:700;font-size:18px}
.complete:hover{background:var(--maroon-d)}
.complete:disabled{opacity:.6;cursor:wait}
.madeline{flex:1;color:var(--green-d);font-weight:700}
.undo{border:0;background:none;padding:8px 0;color:var(--soft);text-decoration:underline;font-size:15px}
.err{color:var(--maroon);font-weight:700;margin-top:8px;font-size:15px}
.err:empty{display:none}

.tot{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.tot h3{margin:0;font:400 20px/1.2 var(--display)}
.tot .row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;margin-top:10px}
.tot img{width:54px;height:54px;border-radius:10px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:9px;padding:2px 8px;font-size:15px;background:#fff}
.chip b{margin-left:4px}

.empty{text-align:center;color:var(--soft);padding:36px 12px}
.empty b{display:block;font:400 24px/1.2 var(--display);color:var(--ink);margin-bottom:6px}
.msg{max-width:560px;margin:40px auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center}
.msg h2{font:400 26px/1.2 var(--display);margin:0 0 10px}
.toast{position:fixed;bottom:18px;left:50%;z-index:6;transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;white-space:nowrap;transition:transform .25s}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast{visibility:hidden}
footer{color:var(--soft);font-size:14px;padding:0 0 30px}

@media (min-width:760px){
  .list{grid-template-columns:1fr 1fr;align-items:start}
  .stats{grid-template-columns:repeat(3,minmax(0,220px))}
}
@media (min-width:1100px){.list{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>Shirt Printer</h1>
  <p>Whitehouse COGIC Shirt Sale. New orders show up here by themselves. Tap <b>Completed</b> when an order is made.</p>
</div></header>

<div id="app" hidden>
  <div class="wrap">
    <div class="stats">
      <div class="stat todo"><b id="sTodo">0</b><span>orders to make</span></div>
      <div class="stat"><b id="sShirts">0</b><span>shirts to make</span></div>
      <div class="stat"><b id="sDone">0</b><span>orders completed</span></div>
    </div>
  </div>
  <div class="bar"><div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="todo" aria-selected="true" onclick="setView('todo')">To make<small id="tTodo"></small></button>
      <button class="tab" role="tab" data-v="shirts" aria-selected="false" onclick="setView('shirts')">Shirt totals<small id="tShirts"></small></button>
      <button class="tab" role="tab" data-v="done" aria-selected="false" onclick="setView('done')">Completed<small id="tDone"></small></button>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="paidOnly" onchange="draw()"> Only paid orders</label>
      <span><span id="upd"></span> <button type="button" class="refresh" onclick="load(true)">Refresh</button></span>
    </div>
  </div></div>
  <div class="wrap"><div class="list" id="list"></div></div>
  <footer><div class="wrap" id="foot"></div></footer>
</div>

<div class="wrap" id="gate"><div class="msg"><h2>Loading orders…</h2></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwChjtAqh2tMSnl8ql0o_8FHQ-iBNXX91VmNLPBzDpZ0abSyrkkub4FC30XCs8IAXvy/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const SEEN = 'wcogic-printer-seen';
let CFG = null, IMG = {}, ORDERS = [], VIEW = 'todo', seenAt = 0, timer;
try { seenAt = Number(localStorage.getItem(SEEN)) || 0; } catch (e) {}

const post = body => fetch(API, { method: 'POST', credentials: 'omit', body: JSON.stringify(Object.assign({ key: KEY }, body)) })
  .then(r => r.json()).then(d => { if (!d.ok) throw new Error(d.error || 'Something went wrong.'); return d.result; });
const when = t => t ? new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const day = t => t ? new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
function img(it) {
  if (!CFG) return '';
  const d = CFG.designs.find(x => x.name === it.design), g = CFG.garments.find(x => x.name === it.item), c = CFG.colors.find(x => x.name === it.color);
  const u = d && g && c && IMG[d.id + '_' + c.id + '_' + g.id];
  return u ? u.replace(/=w\d+$/, '') + '=w200' : '';
}
const sizeRank = s => { const i = CFG ? CFG.sizes.indexOf(s) : -1; return i < 0 ? 99 : i; };
const count = o => o.items.reduce((s, i) => s + i.qty, 0);
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 2200); }

function gate(title, text) {
  $('app').hidden = true;
  $('gate').innerHTML = `<div class="msg"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
  $('gate').hidden = false;
}

function load(manual) {
  if (!KEY) return gate('This link is missing its key', 'Ask Jaylon Stewart to send you the printer link again.');
  const cfg = CFG ? Promise.resolve() : fetch(API + '?api=config', { credentials: 'omit' }).then(r => r.json()).then(d => { CFG = d.cfg; IMG = d.img; }).catch(() => {});
  return cfg.then(() => post({ action: 'printerQueue' })).then(r => {
    ORDERS = r.orders;
    $('foot').textContent = 'Order deadline: ' + r.deadline + '. Questions? Contact Jaylon Stewart.';
    $('gate').hidden = true; $('app').hidden = false;
    $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '.';
    draw();
    if (manual) toast('Orders updated');
  }).catch(e => {
    if (/not valid/.test(e.message)) return gate('This link is not valid', e.message);
    if ($('app').hidden) gate('Orders did not load', 'Check your connection, then reload the page.');
    else $('upd').textContent = 'Could not update. Check your connection.';
  });
}

function setView(v) {
  VIEW = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  draw();
  if (v === 'todo') markSeenSoon();
}
function markSeenSoon() {
  // Keeps the "New" tag on screen for a moment, then remembers they were seen
  clearTimeout(markSeenSoon._h);
  markSeenSoon._h = setTimeout(() => { seenAt = Date.now(); try { localStorage.setItem(SEEN, String(seenAt)); } catch (e) {} }, 8000);
}

function draw() {
  const paidOnly = $('paidOnly').checked;
  const pool = ORDERS.filter(o => !paidOnly || o.paid);
  const todo = pool.filter(o => !o.made).sort((a, b) => a.time - b.time);
  const done = pool.filter(o => o.made).sort((a, b) => (b.madeOn || b.time) - (a.madeOn || a.time));
  const shirts = todo.reduce((s, o) => s + count(o), 0);
  $('sTodo').textContent = todo.length; $('sShirts').textContent = shirts; $('sDone').textContent = done.length;
  $('tTodo').textContent = todo.length + (todo.length === 1 ? ' order' : ' orders');
  $('tShirts').textContent = shirts + (shirts === 1 ? ' shirt' : ' shirts');
  $('tDone').textContent = done.length + (done.length === 1 ? ' order' : ' orders');
  const list = $('list');
  if (VIEW === 'shirts') return drawTotals(todo);
  const rows = VIEW === 'todo' ? todo : done;
  if (!rows.length) {
    list.innerHTML = VIEW === 'todo'
      ? '<div class="empty"><b>All caught up</b>New orders will show up here by themselves.</div>'
      : '<div class="empty"><b>Nothing completed yet</b>Orders you mark Completed will show up here.</div>';
    return;
  }
  list.innerHTML = rows.map(card).join('');
}

function card(o) {
  const isNew = !o.made && seenAt && o.time > seenAt;
  const items = o.items.slice().sort((a, b) => sizeRank(a.size) - sizeRank(b.size)).map(it => {
    const u = img(it);
    return `<li>${u ? `<img src="${esc(u)}" alt="" loading="lazy">` : '<span></span>'}<div><b>${esc(it.design)} ${esc(it.item)}</b><span class="sub">${esc(it.color)}<span class="size">${esc(it.size)}</span></span></div><span class="qty">×${it.qty}</span></li>`;
  }).join('');
  const act = o.made
    ? `<span class="madeline">✓ Completed ${esc(day(o.madeOn))}</span><button type="button" class="undo" onclick="mark('${esc(o.id)}',false,this)">Undo</button>`
    : `<button type="button" class="complete" onclick="mark('${esc(o.id)}',true,this)">Completed</button>`;
  return `<article class="card${o.made ? ' done' : ''}${isNew ? ' new' : ''}" id="o-${esc(o.id)}">
    <div class="head"><div><div class="num">${esc(o.id)}</div><div class="who">${esc(o.name)}</div><div class="when">${esc(when(o.time))} · ${count(o)} ${count(o) === 1 ? 'shirt' : 'shirts'}</div></div>
      <div class="tags">${isNew ? '<span class="tag newt">New</span>' : ''}${o.paid ? '<span class="tag paid">Paid</span>' : '<span class="tag unpaid">Not paid yet</span>'}</div></div>
    <ul class="items">${items}</ul>
    ${o.notes ? `<p class="note"><b>Note:</b> ${esc(o.notes)}</p>` : ''}
    <div class="act">${act}</div><div class="err"></div>
  </article>`;
}

function drawTotals(todo) {
  const groups = {};
  todo.forEach(o => o.items.forEach(it => {
    const k = it.design + '|' + it.item + '|' + it.color;
    const g = groups[k] || (groups[k] = { it, sizes: {}, n: 0 });
    g.sizes[it.size] = (g.sizes[it.size] || 0) + it.qty; g.n += it.qty;
  }));
  const keys = Object.keys(groups);
  if (!keys.length) { $('list').innerHTML = '<div class="empty"><b>Nothing left to make</b>Shirt totals for open orders show up here.</div>'; return; }
  const byDesign = {};
  keys.forEach(k => { const d = groups[k].it.design; (byDesign[d] = byDesign[d] || []).push(groups[k]); });
  const order = CFG ? CFG.designs.map(d => d.name) : Object.keys(byDesign);
  $('list').innerHTML = order.filter(d => byDesign[d]).map(d => `<section class="tot"><h3>${esc(d)}</h3>${byDesign[d]
    .sort((a, b) => (a.it.item + a.it.color).localeCompare(b.it.item + b.it.color))
    .map(g => { const u = img(g.it); return `<div class="row">${u ? `<img src="${esc(u)}" alt="" loading="lazy">` : '<span></span>'}<div><b>${esc(g.it.item)}, ${esc(g.it.color)}</b><div class="chips">${Object.keys(g.sizes).sort((a, b) => sizeRank(a) - sizeRank(b)).map(s => `<span class="chip">${esc(s)}<b>×${g.sizes[s]}</b></span>`).join('')}</div></div><span class="qty">${g.n}</span></div>`; }).join('')}</section>`).join('');
}

function mark(id, made, btn) {
  const cardEl = $('o-' + id), err = cardEl && cardEl.querySelector('.err');
  btn.disabled = true; if (err) err.textContent = '';
  const was = btn.textContent; btn.textContent = made ? 'Saving…' : 'Undoing…';
  post({ action: 'printerMark', id, made }).then(r => {
    const o = ORDERS.find(x => x.id === id); if (o) { o.made = r.made; o.madeOn = r.madeOn; }
    draw(); toast(made ? id + ' marked completed' : id + ' moved back to To make');
  }).catch(e => { btn.disabled = false; btn.textContent = was; if (err) err.textContent = e.message || 'That did not save. Check your connection and try again.'; });
}

load().then(() => markSeenSoon());
timer = setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
